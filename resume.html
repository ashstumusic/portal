<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Resume</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #525659; }
  iframe { display: block; width: 100vw; height: 100dvh; border: none; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap;
  }
</style>
</head>
<body>
<main>
<h1 class="sr-only">Ashton Stubblefield &ndash; Resume</h1>
<iframe id="resume-frame" title="Resume"></iframe>
<nav>
  <a href="index.html" class="nav-link">Home</a>
</nav>
</main>
<script>
  // A plain <iframe src="foo.pdf"> renders at the PDF's native point
  // size on iOS Safari - it doesn't fit the iframe width, and pinch-
  // zoom on it is unreliable, so the page reads as zoomed-in/cropped
  // with no way to zoom out. Google's viewer renders the PDF as a
  // normal responsive web page instead, which fits every screen width
  // and zooms/scrolls like any other page, on every browser.
  var pdfUrl = location.href.replace(/\/[^\/]*$/, '/') + 'Ashton_Stubblefield_Resume.pdf';
  document.getElementById('resume-frame').src =
    'https://docs.google.com/viewer?embedded=true&url=' + encodeURIComponent(pdfUrl);
</script>
</body>
</html>
