<style>
/* The page GitHub Pages serves for any address that does not exist (it is used at every depth of the site, so every
   address in it starts with "/"). Self-contained on purpose: the site's own fonts and colours, no scripts.
   Accessibility: one heading, plain words, two real links with 44px targets and a visible focus ring; nothing moves. */
@font-face { font-family: 'Logo'; src: url('/Fonts/subsetted/Boiled-Pasta.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'UI'; src: url('/Fonts/subsetted/BricolageGrotesque-VF.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
* { box-sizing: border-box; margin: 0; }
html { color-scheme: light; }
/* the Figment Zine look (2026-11-22): paper, ink, ink-stamp buttons, the name in its rainbow with an ink outline */
@font-face { font-family: 'Homework'; src: url('/Fonts/figment.ttf') format('truetype'); font-display: swap; }
body { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; background: #F4EFE4; color: #16130F; font: 400 18px/1.55 'UI', system-ui, sans-serif; text-align: center; }
main { max-width: 34rem; }
.name { display: inline-block; padding-top: .12em; font: 400 clamp(56px, 16vw, 104px)/1 'Logo', cursive; text-decoration: none; background: linear-gradient(100deg, #FF8AC8 0%, #FFA36B 32%, #F7C549 62%, #8FE6FF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 2px #16130F; filter: drop-shadow(4px 4px 0 #16130F); }
.note { display: block; margin-top: 10px; font: 400 26px/1.1 'Homework', cursive; color: #4D473E; rotate: -2deg; }
h1 { margin: 22px 0 10px; font: 800 clamp(26px, 5.5vw, 36px)/1.15 'UI', system-ui, sans-serif; letter-spacing: -.02em; }
p { color: #2E2A24; }
nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 28px; }
nav a { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 999px; background: #FFFCF5; border: 2px solid #16130F; box-shadow: 3px 3px 0 #16130F; color: #16130F; font-weight: 700; text-decoration: none; transition: transform .14s, box-shadow .14s, background-color .14s; }
nav a:first-child { background: #16130F; color: #F4EFE4; box-shadow: 3px 3px 0 #F7C549; }
nav a:hover, nav a:focus-visible { background: #F7C549; color: #16130F; }
nav a:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #16130F; }
a:focus-visible { outline: 3px solid #16130F; outline-offset: 3px; }
/* Phones: one even column (wrapping left "Videos" alone on a second row) */
@media (max-width: 480px) { nav { flex-direction: column; align-items: center; } nav a { justify-content: center; width: min(100%, 280px); } }
nav a svg { flex: none; }   /* (every button: a picture and a word) */
@media (forced-colors: active) { nav a { border: 1px solid ButtonText; box-shadow: none; } .name { filter: none; color: CanvasText; -webkit-text-stroke: 0; background: none; } }
</style>
</head>
