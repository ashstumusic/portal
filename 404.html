/* The page GitHub Pages serves for any address that does not exist (it is used at every depth of the site, so every
   address in it starts with "/"). Self-contained on purpose: the site's own fonts and colours, no scripts.
   Accessibility: one heading, plain words, two real links with 44px targets and a visible focus ring; nothing moves. */
@font-face { font-family: 'Logo'; src: url('/Fonts/subsetted/Boiled-Pasta.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'UI'; src: url('/Fonts/subsetted/BricolageGrotesque-VF.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
* { box-sizing: border-box; margin: 0; }
html { color-scheme: dark; }
body { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; background: #07090C; color: #F2F4F6; font: 400 18px/1.55 'UI', system-ui, sans-serif; text-align: center; }
main { max-width: 34rem; }
.name { display: inline-block; font: 400 clamp(56px, 16vw, 104px)/1 'Logo', cursive; color: #F7C549; text-decoration: none; filter: drop-shadow(3px 3px 0 rgb(223 43 44 / .55)); }
h1 { margin: 28px 0 10px; font: 700 clamp(24px, 5vw, 32px)/1.2 'UI', system-ui, sans-serif; }
p { color: rgb(242 244 246 / .82); }
nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
nav a { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 14px; background: rgb(255 255 255 / .1); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .22); color: #F2F4F6; font-weight: 600; font-size: 16px; text-decoration: none; }
nav a:hover, nav a:focus-visible { background: #F7C549; color: #111; box-shadow: none; }
a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; border-radius: 14px; }
/* Phones: one even column (wrapping left "Videos" alone on a second row) */
@media (max-width: 480px) { nav { flex-direction: column; align-items: center; } nav a { justify-content: center; width: min(100%, 280px); } }
nav a svg { flex: none; }   /* (every button: a picture and a word) */
@media (forced-colors: active) { nav a { border: 1px solid ButtonText; } .name { filter: none; } }
</style>
