name: Update site content

# Regenerates releases.json / videos.json / lyrics.json from the Audio/,
# Images/Releases/, and Video Files/ folders whenever they change, so
# adding or removing a release/video entry never needs an HTML or
# JS edit - just add or delete files in those folders and push (or upload
# directly via the GitHub web UI) and the live site picks it up.
#
# Deliberately does NOT trigger on changes to the generated *.json files
# themselves, so this workflow's own commit can't re-trigger itself.

on:
  push:
    branches: [main]
    paths:
      - "Audio/**"
      - "Images/Releases/**"
      - "Video Files/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-content
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not a shallow clone - generate_content.py uses
          # `git log` to find each item's first-added date for ordering
          # (e.g. which release is "latest"). A shallow clone would make
          # that lookup come back empty and silently break ordering.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # (pinned: a brand-new Python can lack ready-made Pillow builds, which failed this job)

      # (Pillow reads each cover's average colour, shown while the cover loads; mutagen reads each song's running time,
      # for the lyric pages and for each album card's "9 songs · 30 min" - it must be in place BEFORE releases.json is
      # written, or the songs' lengths are left out and the cards lose their running time)
      - name: Install Pillow and mutagen
        run: python3 -m pip install --quiet pillow==10.4.0 mutagen==1.46.0

      - name: Generate releases.json / videos.json
        run: python3 scripts/generate_content.py

      - name: Build static lyric, album, video and section pages, sitemap entries and robots.txt
        run: python3 scripts/build_lyrics_pages.py

      # (No album ZIPs are made here any more: each Download button makes its ZIP in the visitor's browser from the
      # site's own files. releases.json lists what goes in each one; see scripts/album_zip.py live_plan.)

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.json videos.json lyrics.json sitemap.xml robots.txt llms.txt lyrics albums videos watch press-kit contact music music-videos about
          if git diff --cached --quiet; then
            echo "No content changes - nothing to commit."
          else
            git commit -m "Auto-update site content [skip ci]"
            git push
          fi
